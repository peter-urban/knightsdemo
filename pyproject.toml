[project]
authors = [{name = "Peter Urban", email = "peter.urban@ugent.be"}]
dependencies = []
name = "knightsdemo"
requires-python = ">= 3.11"
version = "0.1.1"

[tool.pixi.workspace]
channels = ["conda-forge", "themachinethatgoesping"]
platforms = [
    { platform = "linux-64", glibc = "2.34" },
    { platform = "osx-arm64", macos = "14.0" },
    "win-64",
]

[tool.pixi.tasks]
start = "pixi run jupyter lab knightsdemo.ipynb"

[tool.pixi.dependencies]
git = "*"
python = "3.14.*"
jupyterlab = ">=4.6.3,<5"
#knightswhosaydb = ">=0.1.0.devp,<0.2"
#themachinethatgoesping = ">=0.35.1,<0.36"
#rasterio = ">=1.5.0,<2"

[tool.pixi.pypi-dependencies]
knightswhosaydb = { git = "https://github.com/benjaminmisiuk/knightswhosaydb", rev = "247587a" }
